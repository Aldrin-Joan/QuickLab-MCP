[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "QuickLab-MCP"
version = "0.2.1"
description = "QuickLab MCP Server - Production Tabular ML Experimentation Control Plane for AI Agents"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [
    { name = "QuickLab Team" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastmcp==4.0.5",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.30,<3.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.4",
    "boto3>=1.34.0",
    "aioboto3>=13.0.0",
    "botocore>=1.34.0",
    "pyarrow>=16.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.0.3",
    "lightgbm>=4.3.0",
    "catboost>=1.2.5",
    "joblib>=1.4.0",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=42.0.0",
    "alembic>=1.13.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
    "uvicorn>=0.30.0",
]

[project.urls]
Homepage = "https://github.com/Aldrin-Joan/QuickLab-MCP"
Repository = "https://github.com/Aldrin-Joan/QuickLab-MCP.git"
Issues = "https://github.com/Aldrin-Joan/QuickLab-MCP/issues"
Documentation = "https://github.com/Aldrin-Joan/QuickLab-MCP#readme"

[project.scripts]
quicklab = "ml_mcp.server.stdio:run_stdio"
quicklab-mcp = "ml_mcp.server.stdio:run_stdio"
modellab = "ml_mcp.server.stdio:run_stdio"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-redis>=4.6.0",
    "types-boto3>=1.34.0",
    "types-PyYAML>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

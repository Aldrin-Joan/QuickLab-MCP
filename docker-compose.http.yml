services:
  postgres:
    image: postgres:16-alpine
    container_name: modellab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: modellab
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d modellab"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: modellab-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: modellab-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb local/modellab-artifacts --ignore-existing;
      /usr/bin/mc anonymous set none local/modellab-artifacts;
      exit 0;
      "

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    container_name: modellab-otel
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/docker/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"

  db-migrate:
    image: ghcr.io/aldrin-joan/quicklab-api:latest
    build:
      context: .
      target: ml-mcp-api
    container_name: modellab-db-migrate
    entrypoint: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/modellab
    restart: "no"

  api:
    image: ghcr.io/aldrin-joan/quicklab-api:latest
    build:
      context: .
      target: ml-mcp-api
    container_name: modellab-mcp-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      MCP_HOST: "0.0.0.0"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/modellab
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORE_ENDPOINT_URL: http://minio:9000
      OBJECT_STORE_ACCESS_KEY_ID: minioadmin
      OBJECT_STORE_SECRET_ACCESS_KEY: minioadmin
      OBJECT_STORE_BUCKET_NAME: modellab-artifacts
      RATE_LIMIT_EXPERIMENT_PER_MINUTE: 120
      RATE_LIMIT_METADATA_PER_MINUTE: 120
      RATE_LIMIT_READ_PER_MINUTE: 300
      RATE_LIMIT_ANALYSIS_PER_MINUTE: 60
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    image: ghcr.io/aldrin-joan/quicklab-worker:latest
    build:
      context: .
      target: ml-worker-tabular-cpu
    container_name: modellab-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/modellab
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORE_ENDPOINT_URL: http://minio:9000
      OBJECT_STORE_ACCESS_KEY_ID: minioadmin
      OBJECT_STORE_SECRET_ACCESS_KEY: minioadmin
      OBJECT_STORE_BUCKET_NAME: modellab-artifacts

volumes:
  postgres_data:
  redis_data:
  minio_data:

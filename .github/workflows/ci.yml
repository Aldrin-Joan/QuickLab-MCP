name: ModelLab CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Linter
        run: ruff check .

      - name: Check Formatting
        run: ruff format --check .

  test-suite:
    name: Automated Verification & Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: modellab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/modellab_test
        run: |
          alembic upgrade head

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/modellab_test
          REDIS_URL: redis://localhost:6379/0
          AUTH_ENABLED: "true"
        run: |
          pytest tests/ -v --cov=ml_mcp --cov-report=term-missing --cov-report=xml

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  docker-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: [lint-and-format, test-suite]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build ml-mcp-api Target
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ml-mcp-api
          push: false
          tags: modellab/ml-mcp-api:latest

      - name: Build ml-worker-tabular-cpu Target
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ml-worker-tabular-cpu
          push: false
          tags: modellab/ml-worker-tabular-cpu:latest

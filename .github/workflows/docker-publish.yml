name: Build & Publish Container Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-containers:
    name: Build & Push GHCR Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Lowercase Repo Owner & Version
        id: meta
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${VERSION}" != v* ]]; then
            VERSION="v0.1.0"
          fi
          echo "owner=${OWNER}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build & Push API Image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ml-mcp-api
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/quicklab-api:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/quicklab-api:${{ steps.meta.outputs.version }}

      - name: Build & Push Worker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ml-worker-tabular-cpu
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/quicklab-worker:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/quicklab-worker:${{ steps.meta.outputs.version }}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" style="background:#090A0F; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Modern ML Lighting (Databricks / Modal / PyTorch Inspired: Electric Ember & Signal Emerald) -->
    <radialGradient id="mlEmberGlow" cx="20%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#FF5C00" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#090A0F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mlTealGlow" cx="85%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#090A0F" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient (Pure White to Warm Data Tangerine) -->
    <linearGradient id="titleEmberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FF7A1A"/>
    </linearGradient>

    <!-- Pill Border Highlight -->
    <linearGradient id="emberPillBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF5C00" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Terminal Box Border -->
    <linearGradient id="termBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3343"/>
      <stop offset="100%" stop-color="#181C26"/>
    </linearGradient>

    <!-- Precision Data Engineering Matrix (28px spacing) -->
    <pattern id="matrixGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#161A24" stroke-width="0.75"/>
    </pattern>
  </defs>

  <!-- Deep Obsidian Dark Canvas -->
  <rect width="1200" height="630" fill="#090A0F"/>
  <rect width="1200" height="630" fill="url(#matrixGrid)"/>

  <!-- Ambient Light Fields -->
  <rect width="1200" height="630" fill="url(#mlEmberGlow)"/>
  <rect width="1200" height="630" fill="url(#mlTealGlow)"/>

  <!-- Elevated Container Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="22" fill="#0E1118" fill-opacity="0.9" stroke="#1C212E" stroke-width="1.2"/>

  <!-- TOP HEADER PILLS -->
  <!-- Pill 1: Open Source MCP Server (Width 246: plenty of right padding, perfectly balanced) -->
  <g transform="translate(80, 78)">
    <rect width="246" height="34" rx="17" fill="#141822" stroke="url(#emberPillBorder)" stroke-width="1.2"/>
    <circle cx="18" cy="17" r="4.5" fill="#FF7A1A"/>
    <text x="32" y="21.5" font-size="11" font-weight="700" fill="#F8FAFC" letter-spacing="0.06em">OPEN SOURCE MCP SERVER</text>
  </g>

  <!-- Pill 2: FastMCP Engine (Width 160) -->
  <g transform="translate(338, 78)">
    <rect width="160" height="34" rx="17" fill="#141822" stroke="#222838" stroke-width="1"/>
    <circle cx="18" cy="17" r="3.5" fill="#10B981"/>
    <text x="30" y="21.5" font-size="12" font-weight="600" fill="#CBD5E1" letter-spacing="0.03em">FastMCP 4.0.5 GA</text>
  </g>

  <!-- Pill 3: Version Tag (Right Aligned) -->
  <g transform="translate(976, 78)">
    <rect width="104" height="34" rx="17" fill="#141822" stroke="#222838" stroke-width="1"/>
    <text x="52" y="21.5" font-size="12" font-weight="700" fill="#FF7A1A" text-anchor="middle" letter-spacing="0.04em">v0.2.1</text>
  </g>

  <!-- MAIN HEADLINE -->
  <text x="80" y="178" font-size="64" font-weight="800" fill="url(#titleEmberGrad)" letter-spacing="-0.03em">QuickLab-MCP</text>

  <!-- TAGLINE & PURPOSE -->
  <text x="80" y="222" font-size="22" font-weight="500" fill="#F1F5F9" letter-spacing="-0.01em">
    Production Tabular ML Experimentation Control Plane for AI Agents
  </text>
  <text x="80" y="252" font-size="15" font-weight="400" fill="#8B949E" letter-spacing="0.01em">
    Zero Arbitrary Code Execution (Zero ACE) • 7 Approved Tabular Engines • Leak-Free Pipelines
  </text>

  <!-- 4 FEATURE CARDS (Modern Engineering Metric Cards) -->
  <g transform="translate(80, 286)">
    <!-- Card 1: Zero ACE (Ember / Security) -->
    <g transform="translate(0, 0)">
      <rect width="245" height="72" rx="12" fill="#121620" stroke="#1F2535" stroke-width="1"/>
      <rect x="14" y="16" width="40" height="40" rx="8" fill="#FF5C00" fill-opacity="0.12"/>
      <path d="M 34 25 L 42 28.5 L 42 36 C 42 41 38.5 45 34 46 C 29.5 45 26 41 26 36 L 26 28.5 Z" fill="none" stroke="#FF7A1A" stroke-width="1.8" stroke-linejoin="round"/>
      <text x="64" y="34" font-size="14" font-weight="700" fill="#FFFFFF">Zero ACE</text>
      <text x="64" y="50" font-size="11" font-weight="400" fill="#8B949E">No unsafe arbitrary code</text>
    </g>

    <!-- Card 2: 7 Tabular Models (Sky / Data Science) -->
    <g transform="translate(265, 0)">
      <rect width="245" height="72" rx="12" fill="#121620" stroke="#1F2535" stroke-width="1"/>
      <rect x="14" y="16" width="40" height="40" rx="8" fill="#0284C7" fill-opacity="0.12"/>
      <path d="M 24 41 L 31 32 L 36 37 L 44 26" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="44" cy="26" r="2" fill="#38BDF8"/>
      <text x="64" y="34" font-size="14" font-weight="700" fill="#FFFFFF">7 Tabular Engines</text>
      <text x="64" y="50" font-size="11" font-weight="400" fill="#8B949E">XGB, LGBM, CatBoost &amp; more</text>
    </g>

    <!-- Card 3: Leak-Free Preprocessing (Emerald / Validation) -->
    <g transform="translate(530, 0)">
      <rect width="245" height="72" rx="12" fill="#121620" stroke="#1F2535" stroke-width="1"/>
      <rect x="14" y="16" width="40" height="40" rx="8" fill="#10B981" fill-opacity="0.12"/>
      <path d="M 26 27 L 42 27 L 36 35 L 36 43 L 32 43 L 32 35 Z" fill="none" stroke="#10B981" stroke-width="1.8" stroke-linejoin="round"/>
      <text x="64" y="34" font-size="14" font-weight="700" fill="#FFFFFF">Leak-Free Splits</text>
      <text x="64" y="50" font-size="11" font-weight="400" fill="#8B949E">Strict training-fold fits</text>
    </g>

    <!-- Card 4: 23 MCP Tools (Indigo / Platform) -->
    <g transform="translate(795, 0)">
      <rect width="245" height="72" rx="12" fill="#121620" stroke="#1F2535" stroke-width="1"/>
      <rect x="14" y="16" width="40" height="40" rx="8" fill="#6366F1" fill-opacity="0.12"/>
      <path d="M 28 27 L 40 39 M 36 27 L 40 27 L 40 31 M 28 35 L 28 39 L 32 39" fill="none" stroke="#818CF8" stroke-width="1.8" stroke-linecap="round"/>
      <text x="64" y="34" font-size="14" font-weight="700" fill="#FFFFFF">23 MCP Tools</text>
      <text x="64" y="50" font-size="11" font-weight="400" fill="#8B949E">Discovery, training &amp; metrics</text>
    </g>
  </g>

  <!-- STYLIZED TERMINAL / QUICKSTART (Clean Consolas Typography) -->
  <g transform="translate(80, 388)">
    <rect width="1040" height="78" rx="12" fill="#07080D" stroke="url(#termBorderGrad)" stroke-width="1.2"/>
    
    <!-- Window Controls -->
    <circle cx="28" cy="39" r="5" fill="#EF4444" fill-opacity="0.75"/>
    <circle cx="46" cy="39" r="5" fill="#F59E0B" fill-opacity="0.75"/>
    <circle cx="64" cy="39" r="5" fill="#10B981" fill-opacity="0.75"/>
    
    <!-- Divider -->
    <line x1="86" y1="20" x2="86" y2="58" stroke="#1C212E" stroke-width="1"/>

    <!-- Terminal Command -->
    <text x="106" y="46" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="600" fill="#FF7A1A">
      $ <tspan fill="#FFFFFF">pip install QuickLab-MCP</tspan>
    </text>

    <!-- Alternative Tool Runner -->
    <text x="530" y="46" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="500" fill="#64748B">
      or <tspan fill="#E2E8F0">uvx quicklab-mcp</tspan> <tspan fill="#10B981">(zero config)</tspan>
    </text>

    <!-- Status Chip -->
    <g transform="translate(920, 22)">
      <rect width="96" height="34" rx="8" fill="#141822" stroke="#222838" stroke-width="1"/>
      <circle cx="20" cy="17" r="3.5" fill="#10B981"/>
      <text x="32" y="21.5" font-size="11" font-weight="700" fill="#E2E8F0" letter-spacing="0.04em">READY</text>
    </g>
  </g>

  <!-- FOOTER BADGES & ARCHITECTURE DETAILS -->
  <g transform="translate(80, 498)">
    <!-- PyPI Badge -->
    <g transform="translate(0, 0)">
      <rect width="195" height="38" rx="10" fill="#0E1118" stroke="#1C212E" stroke-width="1"/>
      <circle cx="22" cy="19" r="7" fill="#FF7A1A" fill-opacity="0.15"/>
      <path d="M 18 16 L 26 16 L 22 22 Z" fill="#FF7A1A"/>
      <text x="38" y="23.5" font-size="12.5" font-weight="600" fill="#E2E8F0">PyPI: QuickLab-MCP</text>
    </g>

    <!-- GitHub Badge -->
    <g transform="translate(210, 0)">
      <rect width="250" height="38" rx="10" fill="#0E1118" stroke="#1C212E" stroke-width="1"/>
      <path d="M 22 11 C 17.6 11 14 14.6 14 19 C 14 22.5 16.3 25.5 19.5 26.6 C 19.9 26.7 20 26.4 20 26.2 L 20 24.8 C 17.8 25.3 17.3 23.8 17.3 23.8 C 16.9 22.9 16.4 22.6 16.4 22.6 C 15.7 22.1 16.5 22.1 16.5 22.1 C 17.3 22.2 17.7 22.9 17.7 22.9 C 18.4 24.1 19.5 23.8 20 23.6 C 20.1 23.1 20.3 22.7 20.5 22.5 C 18.7 22.3 16.8 21.6 16.8 18.5 C 16.8 17.6 17.1 16.9 17.7 16.3 C 17.6 16.1 17.3 15.2 17.8 14.2 C 17.8 14.2 18.5 14 20 15 C 20.7 14.8 21.4 14.7 22.1 14.7 C 22.8 14.7 23.5 14.8 24.2 15 C 25.7 14 26.4 14.2 26.4 14.2 C 26.9 15.2 26.6 16.1 26.5 16.3 C 27.1 16.9 27.4 17.6 27.4 18.5 C 27.4 21.6 25.5 22.3 23.7 22.5 C 24 22.7 24.2 23.2 24.2 23.9 L 24.2 26.2 C 24.2 26.4 24.3 26.7 24.8 26.6 C 27.9 25.5 30.2 22.5 30.2 19 C 30.2 14.6 26.6 11 22 11 Z" fill="#8B949E"/>
      <text x="40" y="23.5" font-size="12.5" font-weight="600" fill="#E2E8F0">GitHub: Aldrin-Joan/QuickLab</text>
    </g>

    <!-- Transports Badge -->
    <g transform="translate(475, 0)">
      <rect width="275" height="38" rx="10" fill="#0E1118" stroke="#1C212E" stroke-width="1"/>
      <circle cx="20" cy="19" r="4" fill="#10B981"/>
      <text x="34" y="23.5" font-size="12.5" font-weight="500" fill="#CBD5E1">Transports: STDIO &amp; HTTP (/mcp)</text>
    </g>

    <!-- Tests & Quality Badge -->
    <g transform="translate(765, 0)">
      <rect width="275" height="38" rx="10" fill="#0E1118" stroke="#1C212E" stroke-width="1"/>
      <circle cx="20" cy="19" r="4" fill="#FF7A1A"/>
      <text x="34" y="23.5" font-size="12.5" font-weight="600" fill="#FF7A1A">108 Tests Passing • 100% Green</text>
    </g>
  </g>
</svg>
